name: PR Pipeline with Helm

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  IMAGE_TAG: pr-${{ github.event.number }}
  NAMESPACE: pr-${{ github.event.number }}
  IMAGE_REPO: ghcr.io/${{ github.repository }}

jobs:
  build-test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Run tests
        run: cargo test --verbose

      - name: Build Docker image
        run: docker build -t $IMAGE_REPO:$IMAGE_TAG .

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Docker image
        run: docker push $IMAGE_REPO:$IMAGE_TAG

  deploy:
    if: github.event.action != 'closed'
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Configure Kubeconfig
        run: echo "${{ secrets.KUBECONFIG }}" > kubeconfig && export KUBECONFIG=$(pwd)/kubeconfig

      - name: Create namespace
        run: kubectl create ns $NAMESPACE || echo "Namespace exists"

      - name: Deploy with Helm
        run: |
          helm upgrade --install hello-backend ./helm/hello-backend \
            --namespace $NAMESPACE \
            --set image.repository=$IMAGE_REPO \
            --set image.tag=$IMAGE_TAG

      - name: Comment test URL
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: "🚀 Test your app at http://pr-${{ github.event.number }}.yourdomain.com"

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Configure Kubeconfig
        run: echo "${{ secrets.KUBECONFIG }}" > kubeconfig && export KUBECONFIG=$(pwd)/kubeconfig

      - name: Delete namespace
        run: kubectl delete ns $NAMESPACE --ignore-not-found
